<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="jsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="jsBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadowJs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#jsBg)" />
  
  <!-- Subtle Grid -->
  <g stroke="#FACC15" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- JS Icon Emblem -->
  <g transform="translate(500, 105)" filter="url(#shadowJs)">
    <rect width="220" height="220" rx="28" fill="url(#jsBadge)" />
    <text x="75" y="175" font-family="system-ui, sans-serif" font-weight="900" font-size="120" fill="#000000">JS</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 80)">
    <rect width="160" height="32" rx="16" fill="#FACC15" fill-opacity="0.2" stroke="#FACC15" stroke-opacity="0.4" />
    <text x="28" y="21" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#FDE047">JAVASCRIPT CORE</text>

    <text x="0" y="85" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF">JavaScript ES6+</text>
    <text x="0" y="130" font-family="system-ui, sans-serif" font-weight="800" font-size="34" fill="#FDE047">Full Developer Guide</text>

    <g transform="translate(0, 170)">
      <rect width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="26" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">Async / Await</text>

      <rect x="145" width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="160" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">DOM &amp; Events</text>

      <rect x="290" width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="310" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">Certificate</text>
    </g>

    <text x="0" y="260" font-family="monospace" font-size="15" fill="#94A3B8">const future = await axienta.learn(&apos;javascript&apos;);</text>
  </g>
</svg>
