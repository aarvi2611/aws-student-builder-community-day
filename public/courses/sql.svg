<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sqlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadowSql" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#sqlBg)" />
  
  <g stroke="#34D399" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Database Cylinder Graphic -->
  <g transform="translate(510, 100)" filter="url(#shadowSql)">
    <!-- Cylinder 1 -->
    <ellipse cx="110" cy="50" rx="90" ry="24" fill="url(#dbGrad)" />
    <path d="M20 50 L20 100 C20 120 200 120 200 100 L200 50 Z" fill="#047857" opacity="0.8"/>
    <ellipse cx="110" cy="100" rx="90" ry="24" fill="url(#dbGrad)" />
    <!-- Cylinder 2 -->
    <path d="M20 100 L20 150 C20 170 200 170 200 150 L200 100 Z" fill="#065F46" opacity="0.8"/>
    <ellipse cx="110" cy="150" rx="90" ry="24" fill="url(#dbGrad)" />
    <!-- Cylinder 3 -->
    <path d="M20 150 L20 200 C20 220 200 220 200 200 L200 150 Z" fill="#064E3B" opacity="0.8"/>
    <ellipse cx="110" cy="200" rx="90" ry="24" fill="#047857" />
    <text x="75" y="110" font-family="monospace" font-weight="900" font-size="28" fill="#FFFFFF">SQL</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 80)">
    <rect width="160" height="32" rx="16" fill="#34D399" fill-opacity="0.2" stroke="#34D399" stroke-opacity="0.4" />
    <text x="24" y="21" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#6EE7B7">DATABASE MASTERY</text>

    <text x="0" y="85" font-family="system-ui, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF">SQL &amp; PostgreSQL</text>
    <text x="0" y="130" font-family="system-ui, sans-serif" font-weight="800" font-size="34" fill="#34D399">Queries &amp; Analytics</text>

    <g transform="translate(0, 170)">
      <rect width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="26" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">Complex Joins</text>

      <rect x="145" width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="160" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">Indexing &amp; CTE</text>

      <rect x="290" width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="310" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">Certificate</text>
    </g>

    <text x="0" y="260" font-family="monospace" font-size="15" fill="#94A3B8">SELECT rank() OVER (PARTITION BY student);</text>
  </g>
</svg>
