<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>
    <filter id="shadowAi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#aiBg)" />
  
  <g stroke="#E879F9" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- AI Neural Chip Graphic -->
  <g transform="translate(500, 100)" filter="url(#shadowAi)">
    <rect width="210" height="210" rx="36" fill="#181825" stroke="#C026D3" stroke-width="3"/>
    
    <!-- Microchip pins -->
    <g stroke="#E879F9" stroke-width="3">
      <line x1="40" y1="0" x2="40" y2="-20"/>
      <line x1="80" y1="0" x2="80" y2="-20"/>
      <line x1="120" y1="0" x2="120" y2="-20"/>
      <line x1="160" y1="0" x2="160" y2="-20"/>

      <line x1="40" y1="210" x2="40" y2="230"/>
      <line x1="80" y1="210" x2="80" y2="230"/>
      <line x1="120" y1="210" x2="120" y2="230"/>
      <line x1="160" y1="210" x2="160" y2="230"/>
    </g>

    <circle cx="105" cy="105" r="55" fill="url(#brainGrad)" />
    <text x="75" y="118" font-family="system-ui" font-weight="900" font-size="36" fill="#FFFFFF">AI</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 80)">
    <rect width="160" height="32" rx="16" fill="#E879F9" fill-opacity="0.2" stroke="#E879F9" stroke-opacity="0.4" />
    <text x="26" y="21" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#F472B6">FUTURE TECH &amp; AI</text>

    <text x="0" y="85" font-family="system-ui, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF">Machine Learning</text>
    <text x="0" y="130" font-family="system-ui, sans-serif" font-weight="800" font-size="34" fill="#F472B6">&amp; AI Fundamentals</text>

    <g transform="translate(0, 170)">
      <rect width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="26" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">Neural Nets</text>

      <rect x="145" width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="160" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">Scikit-Learn</text>

      <rect x="290" width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="310" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">Certificate</text>
    </g>

    <text x="0" y="260" font-family="monospace" font-size="15" fill="#94A3B8">model.fit(X_train, y_train) -&gt; 99.4%</text>
  </g>
</svg>
