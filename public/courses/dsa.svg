<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dsaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadowDsa" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#dsaBg)" />
  
  <!-- Subtle Grid -->
  <g stroke="#818CF8" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Right Graphic: Binary Tree & Graph Network -->
  <g transform="translate(480, 100)" filter="url(#shadowDsa)">
    <!-- Tree edges -->
    <line x1="120" y1="40" x2="60" y2="110" stroke="#818CF8" stroke-width="3"/>
    <line x1="120" y1="40" x2="180" y2="110" stroke="#818CF8" stroke-width="3"/>
    <line x1="60" y1="110" x2="30" y2="180" stroke="#818CF8" stroke-width="3"/>
    <line x1="60" y1="110" x2="90" y2="180" stroke="#818CF8" stroke-width="3"/>
    <line x1="180" y1="110" x2="150" y2="180" stroke="#818CF8" stroke-width="3"/>
    <line x1="180" y1="110" x2="210" y2="180" stroke="#818CF8" stroke-width="3"/>

    <!-- Nodes -->
    <circle cx="120" cy="40" r="22" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <text x="114" y="46" font-family="system-ui" font-weight="bold" font-size="16" fill="#FFF">A</text>

    <circle cx="60" cy="110" r="20" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <text x="54" y="116" font-family="system-ui" font-weight="bold" font-size="15" fill="#FFF">B</text>

    <circle cx="180" cy="110" r="20" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <text x="174" y="116" font-family="system-ui" font-weight="bold" font-size="15" fill="#FFF">C</text>

    <circle cx="30" cy="180" r="16" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="25" y="185" font-family="system-ui" font-weight="bold" font-size="13" fill="#A5B4FC">D</text>

    <circle cx="90" cy="180" r="16" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="85" y="185" font-family="system-ui" font-weight="bold" font-size="13" fill="#A5B4FC">E</text>

    <circle cx="150" cy="180" r="16" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="145" y="185" font-family="system-ui" font-weight="bold" font-size="13" fill="#A5B4FC">F</text>

    <circle cx="210" cy="180" r="16" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="204" y="185" font-family="system-ui" font-weight="bold" font-size="13" fill="#A5B4FC">G</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 80)">
    <rect width="160" height="32" rx="16" fill="#818CF8" fill-opacity="0.2" stroke="#818CF8" stroke-opacity="0.4" />
    <text x="22" y="21" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#A5B4FC">INTERVIEW MASTERY</text>

    <text x="0" y="85" font-family="system-ui, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF">Data Structures</text>
    <text x="0" y="130" font-family="system-ui, sans-serif" font-weight="800" font-size="34" fill="#818CF8">&amp; Algorithms (DSA)</text>

    <g transform="translate(0, 170)">
      <rect width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="22" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">LeetCode 250+</text>

      <rect x="145" width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="168" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">Trees &amp; DP</text>

      <rect x="290" width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="310" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">Certificate</text>
    </g>

    <text x="0" y="260" font-family="monospace" font-size="15" fill="#94A3B8">Time: O(N log N) | Space: O(1) Optimal</text>
  </g>
</svg>
