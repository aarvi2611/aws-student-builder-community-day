<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pyIconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pyIconYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#pyBg)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="600" cy="225" r="180" fill="#0284C7" fill-opacity="0.25" filter="blur(60px)" />
  <circle cx="200" cy="120" r="140" fill="#EAB308" fill-opacity="0.15" filter="blur(50px)" />

  <!-- Python Dual Snake Emblem -->
  <g transform="translate(480, 110)" filter="url(#shadow)">
    <!-- Blue Python Half -->
    <path d="M110 20 C60 20 60 50 60 50 L60 80 L115 80 C130 80 145 95 145 110 L145 145 L175 145 C175 145 205 145 205 95 C205 45 160 20 110 20 Z" fill="url(#pyIconBlue)"/>
    <circle cx="90" cy="40" r="8" fill="#FFFFFF"/>

    <!-- Yellow Python Half -->
    <path d="M110 205 C160 205 160 175 160 175 L160 145 L105 145 C90 145 75 130 75 115 L75 80 L45 80 C45 80 15 80 15 130 C15 180 60 205 110 205 Z" fill="url(#pyIconYellow)"/>
    <circle cx="130" cy="185" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 80)">
    <!-- Badge -->
    <rect width="160" height="32" rx="16" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.4" />
    <text x="24" y="21" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#38BDF8">AXIENTA MASTERCLASS</text>

    <!-- Title -->
    <text x="0" y="85" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF">Python Programming</text>
    <text x="0" y="130" font-family="system-ui, sans-serif" font-weight="800" font-size="34" fill="#38BDF8">Complete Track 2026</text>

    <!-- Description pills -->
    <g transform="translate(0, 170)">
      <rect width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="18" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">15 Modules</text>

      <rect x="145" width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="168" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">120+ PYQs</text>

      <rect x="290" width="130" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="310" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">Certificate</text>
    </g>

    <!-- Code Snippet Tag -->
    <text x="0" y="260" font-family="monospace" font-size="15" fill="#94A3B8">&gt;&gt;&gt; from axienta import PythonMastery</text>
  </g>
</svg>
