    <circle cx="70" cy="33" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Typography: AXIENTA -->
  <text x="175" y="94" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5" fill="url(#fullGrad)">AXIENTA</text>

  <!-- Typography: EDTECH with pill background -->
  <rect x="525" y="48" width="138" height="42" rx="10" fill="#4F46E5" fill-opacity="0.1" stroke="#4F46E5" stroke-opacity="0.3" stroke-width="1.5" />
  <text x="545" y="77" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="3" fill="#4F46E5">EDTECH</text>

  <!-- Subtitle Tagline -->
  <text x="178" y="126" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" letter-spacing="0.5" fill="#64748B">Learn • Practice • Master • Get Certified</text>
