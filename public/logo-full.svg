    <!-- Dynamic A Icon -->
    <path d="M40 112 L65 36 C67 30 73 30 75 36 L100 112 C102 118 95 124 89 119 L80 113 C77 111 75 107 74 103 L69 88 L49 88 L44 103 C43 107 41 111 38 113 L30 119 C24 124 38 118 40 112 Z" fill="#FFFFFF" />
